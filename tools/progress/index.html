<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>WWHD Recomp Progress</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a1a2b'/%3E%3Ctext x='16' y='22' font-size='15' font-family='sans-serif' font-weight='700' fill='%231fb8a6' text-anchor='middle'%3E60%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* the design handoff (Claude Design, "Wind Waker Progress Tracker"): tokens and sizes as specified */
:root {
  --bg: #f3f6f8; --ink: #0f2233; --ink2: #3c556a; --ink3: #5b7286; --off: #9aabba;
  --card: #ffffff; --line: #dce6ee; --line2: #e9eff4;
  --navy: #0a1a2b; --navy2: #11263b; --navy3: #17304a; --side: #b9cadb; --side2: #8fa9c2;
  --link: #1f5fb8; --link-hover: #4A8FE7; --link-dark: #6ba8f0;
  --teal: #1fb8a6; --live: #56d66a; --retest: #ffb04d; --retest-ink: #d6e1ec;
  --red: #b34848; --pill-bg: #fbe4e4; --pill-ink: #992f2f; --needs: #9a5512;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased; }
a { color: var(--link); text-decoration: none; cursor: pointer; }
a:hover { color: var(--link-hover); }
.mono { font-family: var(--mono); }
.root { min-height: 100%; display: flex; flex-wrap: wrap; align-items: stretch; }

/* the sidebar: ~280px beside the main column, a full-width block on top under ~840px */
.side { flex: 1 1 280px; background: var(--navy); color: #fff; padding: 28px clamp(16px, 4vw, 24px);
  display: flex; flex-direction: column; gap: 24px; }
.brand { display: flex; flex-direction: column; gap: 4px; }
.brand b { font-size: 19px; font-weight: 800; }
.brand span { font-family: var(--mono); font-size: 11px; color: var(--side2); }
.ringRow { display: flex; align-items: center; gap: 16px; }
.ring { position: relative; width: 112px; height: 112px; flex: none; }
.ring svg { display: block; transform: rotate(-90deg); }
.ring div { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 800; }
.stats { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--side); }
.stats b { color: #fff; font-weight: 600; font-size: 13px; }
/* the roadmap's phases under the ring (plan.json "roadmap"): on the navy of the sidebar and the phone's Now hero */
.phases { display: flex; flex-direction: column; gap: 9px; }
.phase { display: flex; flex-direction: column; gap: 4px; }
.phaseHead { display: flex; align-items: baseline; gap: 8px; font-size: 12px; color: var(--side); line-height: 1.3; }
.phaseHead span { min-width: 0; overflow-wrap: anywhere; }
.phaseHead b { margin-left: auto; color: #fff; font-size: 12px; }
.phaseBar { height: 5px; border-radius: 3px; background: #17304a; overflow: hidden; }
.phaseBar div { height: 100%; background: #1fb8a6; border-radius: 3px; }
.phase small { font-size: 10.5px; color: var(--side2); }
.mPhases { padding: 0 16px; }
.mPhases .phaseHead { font-size: 13px; }
.mPhases .phase small { display: none; }   /* the phone: the bars only; the share is in the hover text */
/* Claude usage (usage.json): on the navy of the sidebar and of the phone's Now hero */
.usage { display: flex; flex-direction: column; gap: 10px; }
.usage .eyebrow { display: flex; align-items: baseline; gap: 8px; }
.usage .eyebrow span { margin-left: auto; letter-spacing: 0; text-transform: none; font-weight: 500; font-size: 10.5px; }
.usage .eyebrow span.stale { color: var(--retest); }
.meter { display: flex; flex-direction: column; gap: 5px; }
.meterHead { display: flex; align-items: baseline; gap: 8px; font-size: 12px; color: var(--side); }
.meterHead b { margin-left: auto; font-family: var(--mono); font-size: 13px; font-weight: 600; color: #fff; }
.meterBar { position: relative; height: 6px; border-radius: 3px; background: var(--navy3); }
.meterBar > div { height: 100%; border-radius: 3px; background: var(--teal); max-width: 100%; }
.meterBar.warning > div { background: var(--retest); }
.meterBar.exceeded > div { background: #e5534b; }
.meterBar > i { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; border-radius: 1px; background: #fff; opacity: .55; }
.meter small { font-size: 11px; color: var(--side2); }
.usageNote { font-size: 10.5px; color: var(--side2); display: flex; align-items: center; gap: 6px; }
.usageNote i { width: 2px; height: 10px; border-radius: 1px; background: #fff; opacity: .55; flex: none; }
.eyebrow { font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--side2); }
.agents { display: flex; flex-direction: column; gap: 12px; }
.agent { background: var(--navy2); border-radius: 9px; overflow: hidden; }
.agent > i { display: block; height: 4px; }
.agent > div { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 5px; }
.agentHead { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.agentHead b { font-weight: 700; font-size: 14px; }
.agentHead .task { font-family: var(--mono); font-size: 10.5px; color: var(--side); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.agentHead .ago { margin-left: auto; font-size: 10.5px; font-weight: 600; white-space: nowrap; color: var(--side2); }
.agentHead .ago.live { color: var(--live); }
.agent p { margin: 0; font-size: 12.5px; line-height: 1.45; color: var(--side); text-wrap: pretty; overflow-wrap: anywhere; }
.nums { display: flex; flex-direction: column; gap: 2px; }
.nums .eyebrow { padding-bottom: 8px; }
.num { display: flex; align-items: baseline; padding: 5px 0; border-bottom: 1px solid var(--navy3); font-size: 12px; color: var(--side); }
.num span { margin-left: auto; font-family: var(--mono); color: #fff; font-weight: 600; }
.fresh { margin-top: auto; font-size: 11px; color: var(--side2); display: flex; align-items: center; gap: 8px; }
.fresh i { width: 7px; height: 7px; border-radius: 50%; background: var(--live); flex: none; }
.fresh i.stale { background: var(--retest); }
.empty { color: var(--side2); font-size: 12px; }

/* the main column */
.main { flex: 999 1 560px; min-width: 0; padding: 28px clamp(16px, 4vw, 32px) 36px; display: flex; flex-direction: column; gap: 28px; }
section { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.head h2 { margin: 0; font-size: 18px; font-weight: 700; }
.head .meta { font-size: 12px; color: var(--ink2); }
.head .headLink { margin-left: auto; font-size: 12.5px; font-weight: 600; }
.pager { margin-left: auto; display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--ink2); }
.pager button { font: inherit; font-size: 12px; padding: 5px 10px; border-radius: 7px; background: #fff; border: 1px solid var(--line);
  cursor: pointer; color: var(--ink); }
.pager button:disabled { color: var(--off); cursor: default; }

.shotBody { display: flex; flex-wrap: wrap; gap: 20px; }
.hero { flex: 3 1 380px; min-width: 0; width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 12px; display: block;
  background: var(--line); cursor: zoom-in; color: transparent; overflow: hidden; }
.shotSide { flex: 2 1 260px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.shotText { display: flex; flex-direction: column; gap: 6px; }
.shotText b { font-size: 20px; font-weight: 700; line-height: 1.25; }
.shotText p { margin: 0; font-size: 13.5px; line-height: 1.55; color: var(--ink2); text-wrap: pretty; overflow-wrap: anywhere; }
.shotText span { font-family: var(--mono); font-size: 11.5px; color: var(--ink3); }
.thumbs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-top: auto; }
.thumbs img { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 5px; display: block; cursor: pointer; opacity: .8;
  background: var(--line); outline: 0 solid transparent; outline-offset: 1px; color: transparent; overflow: hidden; }
.thumbs img.on { outline: 2px solid var(--link); opacity: 1; }

.bugGrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
.bug { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column;
  gap: 8px; cursor: pointer; min-width: 0; }
.bugHead { display: flex; align-items: center; gap: 8px; }
.bugHead .id { font-family: var(--mono); font-size: 12px; font-weight: 700; color: var(--red); }
.pill { font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 999px; background: var(--pill-bg); color: var(--pill-ink); }
.bugHead .ago { margin-left: auto; font-size: 11px; color: var(--ink3); }
.bug .title { font-size: 13.5px; font-weight: 600; line-height: 1.4; text-wrap: pretty; }
.bug .body { font-size: 12px; color: var(--ink2); line-height: 1.5; text-wrap: pretty; overflow-wrap: anywhere; }
.bugFoot { margin-top: auto; display: flex; align-items: baseline; gap: 8px; padding-top: 2px; }
.bugFoot .needs { font-size: 12px; font-weight: 600; color: var(--needs); }
.bugFoot .chev { margin-left: auto; font-size: 11px; color: var(--link); white-space: nowrap; }
.retestTile { background: var(--navy); color: #fff; border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px;
  justify-content: space-between; min-height: 120px; }
.retestTile b { font-size: 40px; font-weight: 800; line-height: 1; color: var(--retest); }
.retestTile span { font-size: 13px; line-height: 1.4; color: var(--retest-ink); }
.retestTile a { font-size: 12px; font-weight: 600; color: var(--link-dark); }

.kanban { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; align-items: start; }
.col { border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.col.done { gap: 6px; }
.colHead { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; padding: 2px 4px; }
.colHead i { width: 8px; height: 8px; border-radius: 50%; }
.colHead span { font-family: var(--mono); font-weight: 500; }
.col.open { background: #e6edf2; } .col.open .colHead i { background: #8494a4; } .col.open .colHead span { color: var(--ink3); }
.col.working { background: #f6ecdd; } .col.working .colHead i { background: #e0943a; } .col.working .colHead span { color: #8a5a22; }
.col.done { background: #e1efe4; } .col.done .colHead i { background: #3da343; } .col.done .colHead span { color: #2f6b3a; }
.q { background: #fff; border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.q .name { font-family: var(--mono); font-size: 12.5px; font-weight: 700; }
.q .desc { font-size: 12px; color: var(--ink2); line-height: 1.4; overflow-wrap: anywhere; }
.q.working { gap: 6px; }
.qHead { display: flex; align-items: center; gap: 6px; }
.owner { margin-left: auto; display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--ink2); }
.sq { width: 7px; height: 7px; border-radius: 2px; flex: none; background: #8494a4; }
.qbar { height: 5px; border-radius: 3px; background: #efe3d2; overflow: hidden; }
.qbar div { height: 100%; background: #e0943a; }
.qcount { font-family: var(--mono); font-size: 10.5px; color: #8a5a22; }
.q.done { padding: 8px 12px; flex-direction: row; align-items: baseline; gap: 8px; }
.q.done .name { font-size: 12px; flex: none; }
.q.done .desc { font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.q.done .sq { align-self: center; }
/* the queue's lanes (plan.json "lane": each session's own list, worked from its top down) */
.laneHead { display: flex; align-items: center; gap: 6px; margin: 6px 2px 0; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--ink2); }
.laneHead:first-child { margin-top: 0; }
.laneHead .sq { width: 8px; height: 8px; border-radius: 2px; flex: none; }
/* a queue item's actor types still to do ("ids" in plan.json), dropping off as they're converted or found still */
.qleft summary { font-size: 11.5px; font-weight: 600; color: var(--link); cursor: pointer; }
.lchips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.lchip { font-family: var(--mono); font-size: 10.5px; line-height: 1.4; padding: 2px 6px; border-radius: 5px; background: var(--bg); color: var(--ink2); overflow-wrap: anywhere; }
.m .qleft summary { font-size: 13px; padding: 2px 0; }
.m .lchip { font-size: 12px; padding: 3px 7px; }
.earlier { font-size: 11.5px; color: var(--ink3); padding: 2px 4px; }
a.earlier { color: var(--link); font-weight: 600; }

.pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px; align-items: start; }
@media (max-width: 400px) { .pair { grid-template-columns: minmax(0, 1fr); } }
.pair section { gap: 10px; }
.issues { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 4px 18px; }
.issue { padding: 11px 0; border-bottom: 1px solid var(--line2); display: flex; flex-direction: column; gap: 3px; }
.issue:last-child { border-bottom: 0; }
.issue b { font-size: 13px; font-weight: 600; }
.issue span { font-size: 12px; line-height: 1.5; color: var(--ink2); overflow-wrap: anywhere; }
.log { position: relative; display: flex; flex-direction: column; padding-left: 20px; }
.log::before { content: ""; position: absolute; left: 5px; top: 8px; bottom: 8px; width: 2px; background: var(--line); }
.entry { position: relative; padding: 0 0 14px; display: flex; flex-direction: column; gap: 3px; }
.entry > i { position: absolute; left: -19px; top: 4px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--bg); box-sizing: content-box; margin: -2px 0 0 -2px; }
.entry .meta { display: flex; gap: 8px; flex-wrap: wrap; font-family: var(--mono); font-size: 11px; color: var(--ink3); }
.entry .meta b { color: var(--link); font-weight: 400; }
.entry span:last-child { font-size: 12.5px; line-height: 1.45; overflow-wrap: anywhere; }

/* phones (under 600px): the mobile handoff, an app shell with a tab bar; the desktop layout is hidden */
.m { display: none; }
@media (max-width: 599px) {
  .root { display: none; }
  html, body { overflow: hidden; }
  body { -webkit-tap-highlight-color: transparent; }
  .m { display: flex; }
}
.m { height: 100vh; height: 100dvh; max-width: 480px; margin: 0 auto; flex-direction: column; background: var(--bg); overflow: hidden; }
.mHead { flex: none; background: var(--navy); color: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 12px; min-height: 44px; }
.mBrand { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; }
.mBrand b { font-size: 16px; font-weight: 800; }
.mBrand > span { display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 11px; color: var(--side2); }
.mBrand i { width: 6px; height: 6px; border-radius: 50%; background: var(--live); flex: none; }
.mBrand i.stale { background: var(--retest); }
.mRing { position: relative; flex: none; }
.mRing svg { display: block; transform: rotate(-90deg); }
.mRing div { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 800; }
.mMini { width: 44px; height: 44px; cursor: pointer; }
.mMini div { font-size: 11px; }
.mScroll { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.mPane { display: none; }
.mPane.on { display: block; }
.mTabs { flex: none; background: #fff; border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
  padding-bottom: env(safe-area-inset-bottom); }
.mTabs button, .mTabs a { height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer;
  background: none; border: 0; padding: 0; font: inherit; }
.mTabs a > i, .mTabs button > i { width: 28px; height: 3px; border-radius: 2px; background: transparent; }
.mTabs a > span, .mTabs button > span { display: flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; color: var(--ink3); }
.mTabs button.on > i { background: var(--link); }
.mTabs button.on > span { color: var(--ink); }
.mBadge { font-style: normal; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--red); color: #fff; font-size: 11px; font-weight: 700;
  display: flex; align-items: center; justify-content: center; }

.mHero { background: var(--navy); color: #fff; padding: 8px 0 22px; display: flex; flex-direction: column; gap: 20px; }
.mRingRow { display: flex; align-items: center; gap: 18px; padding: 0 16px; }
.mBig { width: 96px; height: 96px; }
.mBig div { font-size: 24px; }
.mStats { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--side); min-width: 0; }
.mStats b { color: #fff; font-weight: 600; font-size: 15px; }
.mUsage { padding: 0 16px; }
.mUsage .meterHead { font-size: 13px; }
.mUsage .meterHead b { font-size: 14px; }
.mUsage .meter small { font-size: 12px; }
.mDeck { display: flex; flex-direction: column; gap: 10px; }
.mDeckHead { display: flex; align-items: baseline; padding: 0 16px; font-size: 10.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--side2); }
.mDeckHead span { margin-left: auto; letter-spacing: 0; text-transform: none; font-weight: 500; font-size: 11px; }
.mCarousel { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding: 0 16px; padding: 0 16px; scrollbar-width: none; }
.mCarousel::-webkit-scrollbar { display: none; }
.mCarousel::after { content: ""; flex: 0 0 6px; }
.mAgent { flex: 0 0 78%; scroll-snap-align: start; background: var(--navy2); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
.mAgent > i { display: block; height: 4px; }
.mAgent > div { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; }
.mAgentHead { display: flex; align-items: baseline; gap: 8px; }
.mAgentHead b { font-weight: 700; font-size: 15px; }
.mAgentHead span { margin-left: auto; font-size: 11px; font-weight: 600; white-space: nowrap; color: var(--side2); }
.mAgentHead span.live { color: var(--live); }
.mAgent .task { font-family: var(--mono); font-size: 11.5px; color: var(--side); overflow-wrap: anywhere; }
.mAgent p { margin: 0; font-size: 13.5px; line-height: 1.45; color: var(--retest-ink); text-wrap: pretty; overflow-wrap: anywhere; }

.mSec { padding: 22px 16px 8px; display: flex; flex-direction: column; gap: 12px; }
.mSec.last { padding-bottom: 28px; }
.mPad { padding: 18px 16px 28px; display: flex; flex-direction: column; gap: 14px; }
.mH { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.mH h2 { margin: 0; font-size: 18px; font-weight: 700; }
.mPad .mH h2 { font-size: 20px; }
.mH span { font-size: 12.5px; color: var(--ink2); }
.mBug { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; }
.mBug .bugHead .id { font-size: 12.5px; }
.mBug .pill { font-size: 11px; padding: 2px 8px; }
.mBug .bugHead .ago { font-size: 12px; }
.mBug .title { font-size: 15px; font-weight: 600; line-height: 1.35; text-wrap: pretty; }
.mBug .body { font-size: 13.5px; color: var(--ink2); line-height: 1.5; text-wrap: pretty; overflow-wrap: anywhere; }
.mBugFoot { display: flex; align-items: center; gap: 8px; padding-top: 4px; border-top: 1px solid var(--line2); min-height: 32px; }
.mBugFoot .needs { font-size: 13px; font-weight: 600; color: var(--needs); }
.mBugFoot .chev { margin-left: auto; font-size: 12.5px; font-weight: 600; color: var(--link); white-space: nowrap; }
.mRetest { background: var(--navy); color: #fff; border-radius: 12px; padding: 14px 16px; display: flex; align-items: center; gap: 14px; min-height: 56px; }
.mRetest b { font-size: 34px; font-weight: 800; line-height: 1; color: var(--retest); }
.mRetest span { font-size: 14px; line-height: 1.35; color: var(--retest-ink); flex: 1; }
.mRetest em { font-style: normal; font-size: 13px; font-weight: 600; color: var(--link-dark); white-space: nowrap; }
.mLatest { background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; }
.mLatest img, .mShot img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: var(--line); color: transparent; overflow: hidden; }
.mLatest > div { padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 5px; }
.mLatest b { font-size: 15px; font-weight: 700; }
.mLatest p { margin: 0; font-size: 13.5px; line-height: 1.5; color: var(--ink2); text-wrap: pretty; overflow-wrap: anywhere; }
.mLatest em { font-style: normal; font-size: 13px; font-weight: 600; color: var(--link); padding-top: 6px; }

.mFeed { display: flex; flex-direction: column; gap: 18px; }
.mShot { display: flex; flex-direction: column; gap: 8px; }
.mShot img { border-radius: 12px; cursor: zoom-in; }
.mShot > div { display: flex; flex-direction: column; gap: 4px; padding: 0 2px; }
.mShot b { font-size: 16px; font-weight: 700; line-height: 1.3; }
.mShot p { margin: 0; font-size: 14px; line-height: 1.5; color: var(--ink2); text-wrap: pretty; overflow-wrap: anywhere; }
.mShot span { font-family: var(--mono); font-size: 12px; color: var(--ink3); }
.mMore { height: 48px; border-radius: 10px; background: #fff; border: 1px solid var(--line); display: flex; align-items: center; justify-content: center;
  font: inherit; font-size: 14px; font-weight: 600; color: var(--link); cursor: pointer; width: 100%; }
.mShowing { text-align: center; font-size: 12px; color: var(--ink3); }

.mSeg { display: flex; gap: 3px; padding: 3px; border-radius: 11px; background: #e6edf2; }
.mSeg button { flex: 1; height: 40px; border-radius: 8px; background: transparent; border: 0; display: flex; align-items: center; justify-content: center;
  gap: 6px; font: inherit; font-size: 13.5px; font-weight: 600; color: var(--ink2); cursor: pointer; padding: 0 4px; min-width: 0; }
.mSeg button.on { background: #fff; color: var(--ink); }
.mSeg button i { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.mSeg button span { font-family: var(--mono); font-weight: 500; color: var(--ink3); }
.mList { display: flex; flex-direction: column; gap: 14px; }
.mQ { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 13px 14px; display: flex; flex-direction: column; gap: 8px; }
.mQHead { display: flex; align-items: center; gap: 8px; min-width: 0; }
.mQHead b { font-family: var(--mono); font-size: 14px; font-weight: 700; overflow-wrap: anywhere; }
.mQHead span { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink2); white-space: nowrap; }
.mQHead span i { width: 8px; height: 8px; border-radius: 2px; }
.mQBar { display: flex; align-items: center; gap: 10px; }
.mQBar > div { flex: 1; height: 6px; border-radius: 3px; background: #efe3d2; overflow: hidden; }
.mQBar > div > div { height: 100%; background: #e0943a; }
.mQBar span { font-family: var(--mono); font-size: 12px; color: #8a5a22; white-space: nowrap; }
.mLane { display: flex; align-items: center; gap: 7px; margin: 8px 2px 0; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--ink2); }
.mLane:first-child { margin-top: 0; }
.mLane i { width: 9px; height: 9px; border-radius: 2px; }
.mQ p { margin: 0; font-size: 13.5px; color: var(--ink2); line-height: 1.45; text-wrap: pretty; overflow-wrap: anywhere; }
.mEmpty { font-size: 13.5px; color: var(--ink3); text-align: center; padding: 18px 0; }
.mCap { font-size: 12.5px; color: var(--ink2); }
.mLog { position: relative; display: flex; flex-direction: column; padding-left: 22px; }
.mLog::before { content: ""; position: absolute; left: 6px; top: 8px; bottom: 8px; width: 2px; background: var(--line); }
.mLog .entry { padding-bottom: 16px; gap: 4px; }
.mLog .entry > i { left: -21px; }
.mLog .entry .meta { font-size: 11.5px; }
.mLog .entry span:last-child { font-size: 14px; }
.mPanel { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 2px 16px; }
.mPanel .issue { padding: 13px 0; gap: 4px; }
.mPanel .issue b { font-size: 14.5px; line-height: 1.35; }
.mPanel .issue span { font-size: 13.5px; }
.mNum { display: flex; align-items: baseline; padding: 13px 0; border-bottom: 1px solid var(--line2); font-size: 14px; color: var(--ink2); }
.mNum:last-child { border-bottom: 0; }
.mNum span { margin-left: auto; font-family: var(--mono); color: var(--ink); font-weight: 700; font-size: 15px; }

/* the enlarged screenshot and the bug list: overlays */
.overlay { position: fixed; inset: 0; z-index: 9; display: none; }
#zoom { background: rgba(0,0,0,.94); align-items: center; justify-content: center; padding: 16px 64px; }
#zoom figure { margin: 0; max-width: 100%; max-height: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px; }
#zoom img { max-width: 100%; max-height: calc(100vh - 90px); border-radius: 8px; }
#zoom figcaption { color: #e6edf3; font-size: .9rem; text-align: center; max-width: 900px; }
#zoom button { position: absolute; background: rgba(255,255,255,.12); color: #fff; border: 0; border-radius: 999px;
  width: 44px; height: 44px; font-size: 28px; line-height: 44px; cursor: pointer; padding: 0; }
#zoom button:hover, #zoom button:focus-visible { background: rgba(255,255,255,.28); outline: none; }
#zoom .prev { left: 10px; top: 50%; transform: translateY(-50%); }
#zoom .next { right: 10px; top: 50%; transform: translateY(-50%); }
#zoom .close { right: 10px; top: 10px; font-size: 24px; }
@media (max-width: 520px) { #zoom { padding: 16px 8px 72px; } #zoom .prev, #zoom .next { top: auto; bottom: 14px; transform: none; }
  #zoom .prev { left: calc(50% - 54px); } #zoom .next { right: calc(50% - 54px); } }
.colList { display: flex; flex-direction: column; gap: 8px; }
.col.done .colList { gap: 6px; }
</style>
</head>

<div id="zoom" class="overlay" role="dialog" aria-modal="true" aria-label="Screenshot">

<script>
const $ = id => document.getElementById(id);
const COLORS = {bottom: "#1fb8a6", main: "#4A8FE7", top: "#DAA520", web: "#d4548a", qa: "#8494a4"};
const color = s => COLORS[s] || "#8494a4";
const SHOTS_PER_PAGE = 12, LOG_COUNT = 12, LIVE_SECONDS = 600;
let data = null, claims = {}, bugList = [], sessions = [], shotList = [], usage = null;
let page = 0, sel = 0, openBugs = {}, lastOk = 0, doneAll = false;
const DONE_SHOWN = 8;

const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
function ago(t) {
  const s = Math.max(0, Date.now() / 1000 - t);
  if (s < 90) return "just now";
  if (s < 5400) return Math.round(s / 60) + " min";
  if (s < 129600) return Math.round(s / 3600) + " h";
  return Math.round(s / 86400) + " d";
}
const agoText = t => { const a = ago(t); return a === "just now" ? a : a + " ago"; };
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c])); }
async function get(name) {
  try { const r = await fetch(name + "?t=" + Date.now(), {cache: "no-store"}); return r.ok ? r.json() : null; }
  catch (e) { return null; }
}

// --- the sidebar: overall progress, the sessions, the numbers ---
// the ring is the whole roadmap (plan.json "roadmap", the owner's phases and weights): each phase's progress is
// set by hand (0-1) or computed ("from": "actors", the types converted or needing nothing; "lanes", the round's
// top and bottom lane items done), and the ring is their weighted mean. The counts (types, queue, bugs) are stats.
function phaseProgress(ph) {
  if (ph.from === "actors") { const k = data.counts || {}; return k.types ? ((k.converted || 0) + (k.still || 0)) / k.types : 0; }
  if (ph.from === "lanes") {
    const items = (data.queue || []).filter(q => q.lane === "top" || q.lane === "bottom");
    return items.length ? items.filter(q => claims[q.id] && claims[q.id].state === "done").length / items.length : 0;
  }
  return Math.max(0, Math.min(1, Number(ph.progress) || 0));
}
function overall() {
  const phases = (data.roadmap || []).map(ph => ({...ph, frac: phaseProgress(ph), weight: Number(ph.weight) || 0}));
  const all = data.groups.flatMap(g => g.actors);
  const queue = (data.queue || []).map(q => claims[q.id] ? claims[q.id].state : "open"), earlier = (data.queue_done || []).length;
  const by = {
    actor: [0, all.length, all.filter(a => a.status === "converted" || a.status === "still").length],
    queue: [0, queue.length + earlier, queue.filter(x => x === "done").length + earlier],
    bug: [0, bugList.length, bugList.filter(x => ["fixed", "verified", "wontfix"].includes(x.state)).length],
  };
  const n = phases.reduce((t, x) => t + x.weight, 0), done = phases.reduce((t, x) => t + x.weight * x.frac, 0);
  return {n, done, phases, by};
}
// the ring's stats: the milestones and the counts; then each roadmap phase with its own bar (why the ring is at X%)
function statsHtml(o) {
  const ms = data.milestones || [], f = x => x && x[1] ? `${x[2]}/${x[1]}` : "–";
  return `<b>The whole roadmap</b><span>Milestones ${ms.filter(m => m.done).length}/${ms.length}</span><span>Actor types ${f(o.by.actor)}</span>` +
    `<span>Queue ${f(o.by.queue)} · Bugs ${f(o.by.bug)}</span>`;
}
function phasesHtml(o) {
  if (!o.phases.length) return "";
  return `<div class="eyebrow">Roadmap</div>` + o.phases.map(ph => {
    const p = Math.round(100 * ph.frac), share = o.n ? Math.round(100 * ph.weight / o.n) : 0;
    return `<div class="phase" title="${esc(ph.name)}: ${p}% done, ${share}% of the whole">
      <div class="phaseHead"><span>${esc(ph.name)}</span><b>${p}%</b></div>
      <div class="phaseBar"><div style="width:${p}%"></div></div><small>${share}% of the whole${ph.from ? " · counted" : ""}</small></div>`;
  }).join("");
}
// the types that need nothing at 60 (plan.json "still"), each with the reason: the hover text of their numbers
const stillTypes = () => data.groups.flatMap(g => g.actors).filter(a => a.status === "still");
// "Obj_Vfan 54 · fan": the type's code name (GameCube profile, else its stage name), number and our label
const typeLabel = a => `${a.code || "?"} ${a.id}${a.name && a.name !== a.code ? " · " + a.name : ""}`;
const LEFT_OPEN = 8;            // a list this short starts open; longer ones fold behind their count
const leftOpen = {};            // item id -> open, kept across the 20 s refresh
function leftHtml(x) {
  if (!x.left || !x.left.length) return "";
  const open = x.id in leftOpen ? leftOpen[x.id] : x.left.length <= LEFT_OPEN;
  return `<details class="qleft" data-left="${esc(x.id)}"${open ? " open" : ""}><summary>${x.left.length} type${x.left.length === 1 ? "" : "s"} left</summary>
    <div class="lchips">${x.left.map(a => `<span class="lchip">${esc(typeLabel(a))}</span>`).join("")}</div></details>`;
}
document.addEventListener("toggle", e => { const d = e.target; if (d.dataset && d.dataset.left) leftOpen[d.dataset.left] = d.open; }, true);
const stillTitle = list => list.map(a => `${a.id}${a.code ? " " + a.code : ""}: ${a.reason}`).join("\n");
function numList() {
  const k = data.counts, still = k.still || 0;
  return [["types converted", k.converted], ["types needing nothing", still, stillTitle(stillTypes())], ["types left at 30", k.types - k.converted - still - k.with_rules],
    ["types in progress", k.with_rules], ["tick & step rules", k.tick_rules], ["functions overridden", k.overrides], ["functions named", k.named_functions],
    ["functions recompiled", k.functions]]
    .map(([l, v, t]) => [l, Number(v).toLocaleString(), t || ""]);
}
const ticketText = () => (data.ticket || "").replace(/^(WW-\d+): /, "$1 · ").replace("native 60 fps, then uncapped", "native 60, then uncapped");
function renderSide() {
  $("title").textContent = data.title || "WWHD Recomp";
  $("ticket").textContent = ticketText();
  const o = overall(), p = o.n ? pct(o.done, o.n) : 0;
  $("ringPct").textContent = p + "%";
  $("ringArc").setAttribute("stroke-dasharray", `${(o.n ? o.done / o.n : 0) * 301.6} 302`);
  $("stats").innerHTML = statsHtml(o);
  $("phases").innerHTML = phasesHtml(o); $("phases").hidden = !o.phases.length;
  $("nums").innerHTML = `<div class="eyebrow">Numbers</div>` + numList().map(([l, v, t]) => `<div class="num"${t ? ` title="${esc(t)}"` : ""}>${l}<span>${v}</span></div>`).join("");
}
// each session: its latest activity (its status line or its latest commit, "session NAME" in the subject),
// the queue items it's working on and its status line
function agentList() {
  const lastCommit = name => Math.max(0, ...((data && data.commits) || []).filter(m => m.subject.includes("session " + name)).map(m => m.time));
  return sessions.map(x => {
    const last = Math.max(x.time, lastCommit(x.session));
    return {name: x.session, last, live: Date.now() / 1000 - last < LIVE_SECONDS,
      task: Object.keys(claims).filter(id => claims[id].state === "working" && claims[id].session === x.session).join(" · "),
      text: x.text && x.text.startsWith(x.session + ": ") ? x.text.slice(x.session.length + 2) : x.text || "idle"};
  });
}
function renderAgents() {
  if (!sessions.length) return;
  $("agents").innerHTML = agentList().map(a => `<div class="agent"><i style="background:${color(a.name)}"></i><div>
      <div class="agentHead"><b>${esc(a.name)}</b><span class="task">${esc(a.task)}</span><span class="ago${a.live ? " live" : ""}">${agoText(a.last)}</span></div>
      <p>${esc(a.text)}</p></div></div>`).join("");
}

// --- screenshots: a hero and twelve thumbnails a page, newest first ---
// a caption reads "PLACE (session NAME): what it shows"; shots with place/session fields need no parsing
function splitCaption(x) {
  let c = x.caption || "", tag = x.tag || x.session || "", place = x.place || "";
  if (!tag) { const m = c.match(/\bsession (\w+)/); if (m) tag = m[1]; }
  if (place) return {place, cap: c, tag};
  let depth = 0, at = -1;
  for (let i = 0; i < c.length - 1; i++) {
    const ch = c[i];
    if (ch === "(") depth++; else if (ch === ")") depth = Math.max(0, depth - 1);
    else if (ch === ":" && c[i + 1] === " " && depth === 0) { at = i; break; }
  }
  let head = at >= 0 ? c.slice(0, at) : c, cap = at >= 0 ? c.slice(at + 2) : "";
  // "(session top: the Darknut's timers)": the session is the tag, the rest belongs to the caption
  head = head.replace(/\s*\(([^()]*?)\bsession \w+(?:[:;,] ?([^()]*))?\)/, (m, pre, post) => {
    const extra = [pre.replace(/[,;]\s*$/, "").trim(), (post || "").trim()].filter(Boolean).join("; ");
    if (extra) cap = cap ? cap + " (" + extra + ")" : extra;
    return "";
  });
  head = head.replace(/ at 60(?: fps)?\b/, "").replace(/ on ww-4 \w+/, "").trim();
  if (!cap) { cap = head; head = head.length > 60 ? head.slice(0, 57).replace(/\s+\S*$/, "") + "…" : head; if (cap === head) cap = ""; }
  return {place: head, cap, tag};
}
function renderShots() {
  const n = shotList.length, pages = Math.max(1, Math.ceil(n / SHOTS_PER_PAGE));
  page = Math.min(page, pages - 1);
  const from = page * SHOTS_PER_PAGE, list = shotList.slice(from, from + SHOTS_PER_PAGE);
  if (sel < from || sel >= from + list.length) sel = from;
  $("shotMeta").textContent = n ? `${n} screenshots · newest first` : "none yet";
  const pager = $("pager");
  pager.querySelector("span").textContent = `${page + 1} of ${pages}`;
  pager.querySelector(".newer").disabled = page === 0;
  pager.querySelector(".older").disabled = page === pages - 1;
  $("thumbs").innerHTML = list.map((x, i) =>
    `<img src="${esc(x.file)}" alt="${esc(splitCaption(x).place)}" loading="lazy" data-i="${from + i}" class="${from + i === sel ? "on" : ""}">`).join("");
  const x = shotList[sel];
  if (!x) return;
  const s = splitCaption(x), hero = $("hero");
  if (hero.getAttribute("src") !== x.file) hero.setAttribute("src", x.file);
  hero.alt = s.place;
  $("heroPlace").textContent = s.place;
  $("heroCap").textContent = s.cap;
  $("heroMeta").textContent = (s.tag ? s.tag + " · " : "") + agoText(x.time);
}
$("thumbs").addEventListener("click", e => { if (e.target.tagName === "IMG") { sel = +e.target.dataset.i; renderShots(); } });
$("pager").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b || b.disabled) return;
  page += b.classList.contains("older") ? 1 : -1; sel = page * SHOTS_PER_PAGE; renderShots();
});

// the enlarged view: buttons, the arrow keys (Esc closes) and a swipe on phones go through every shot
const zoom = $("zoom");
let zoomAt = -1, viewList = [];
// the viewer goes through a list of {file, caption, time}: the screenshots, or a note's images
function openViewer(list, i) { viewList = list; showShot(i); }
function showShot(i) {
  if (!viewList.length) return;
  zoomAt = (i + viewList.length) % viewList.length;
  const x = viewList[zoomAt];
  zoom.querySelector("img").src = x.file;
  zoom.querySelector("img").alt = x.caption;
  $("zoomCap").textContent = `${zoomAt + 1} / ${viewList.length} · ${x.caption} · ${agoText(x.time)}`;
  zoom.style.display = "flex";
}
function closeShot() { zoom.style.display = "none"; zoomAt = -1; }
$("hero").addEventListener("click", () => openViewer(shotList, sel));
zoom.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (b && b.classList.contains("prev")) showShot(zoomAt - 1);
  else if (b && b.classList.contains("next")) showShot(zoomAt + 1);
  else if (b || e.target === zoom) closeShot();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { closeShot(); return; }
  if (zoomAt < 0) return;
  if (e.key === "ArrowLeft") { showShot(zoomAt - 1); e.preventDefault(); }
  else if (e.key === "ArrowRight") { showShot(zoomAt + 1); e.preventDefault(); }
});
let touchX = null;
zoom.addEventListener("touchstart", e => { touchX = e.touches[0].clientX; }, {passive: true});
zoom.addEventListener("touchend", e => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX; touchX = null;
  if (Math.abs(dx) > 40) showShot(zoomAt + (dx < 0 ? 1 : -1));
});

// --- bugs: the open ones need the owner (a short summary, the full note on a tap); the rest are in the list ---
const lastNote = x => x.notes && x.notes.length ? x.notes[x.notes.length - 1] : null;
const openBugList = () => bugList.filter(x => x.state === "open").sort((a, b) => b.time - a.time);
// an open bug's card: its short summary, or (expanded) its details and latest note; the toggle's label
function bugView(x) {
  const note = lastNote(x), ex = !!openBugs[x.id];
  const short = x.short || x.details || (note ? note.text : "");
  const full = note ? note.text : x.details || "";
  return {body: ex ? (x.details && full !== x.details ? x.details + " " : "") + full : short, needs: x.needs || "your input",
    chev: full && full !== short ? (ex ? "Less" : ((note && note.session) || "the") + "’s note") : ""};
}
function renderBugs() {
  const open = openBugList(), fixed = bugList.filter(x => x.state === "fixed");
  $("bugMeta").textContent = `${open.length} open bug${open.length === 1 ? "" : "s"} · ${fixed.length} waiting for your retest`;
  $("bugs").innerHTML = open.map(x => {
    const v = bugView(x);
    return `<div class="bug" data-id="${esc(x.id)}">
      <div class="bugHead"><span class="id">${esc(x.id)}</span><span class="pill">open</span><span class="ago">${agoText(x.time)}</span></div>
      <div class="title">${esc(x.title)}</div>
      <div class="body">${esc(v.body)}</div>
      <div class="bugFoot"><span class="needs">Needs ${esc(v.needs)}</span>${v.chev ? `<span class="chev">${esc(v.chev)}</span>` : ""}</div>
    </div>`;
  }).join("") + `<div class="retestTile"><b>${fixed.length}</b><span>fixed, waiting for your retest</span><a href="testing.html#retest">Open the list →</a></div>`;
}
$("bugs").addEventListener("click", e => {
  const card = e.target.closest(".bug"); if (!card) return;
  openBugs[card.dataset.id] = !openBugs[card.dataset.id]; renderBugs(); renderMobile();
});
// --- the work queue as a board: open, working, done ---
function queueItems() {
  // work the sweeps add between rounds (publish.sh item ID NAME): claims with a name, not in plan.json's queue
  const planned = new Set((data.queue || []).map(q => q.id));
  const extra = Object.entries(claims).filter(([id, c]) => c.name && !planned.has(id)).map(([id, c]) => ({id, name: c.name}));
  return (data.queue || []).concat(extra).map(q => {
    const c = claims[q.id], state = c ? (c.state === "done" ? "done" : "working") : "open";
    const round = (q.name.match(/^Round (\d+):/) || [])[1];
    const name = q.name.replace(/^Round \d+:\s*/, "");
    // its bar: the session's own count (publish.sh step), else its actor types done (converted or needing nothing)
    let prog = null, stillNote = "";
    if (c && c.progress) prog = [c.progress[0], c.progress[1], ""];
    else if (q.ids && q.ids.length) {
      prog = [q.converted || 0, q.ids.length, " types" + (q.still ? ` · ${q.still} need nothing` : "")];
      const mine = new Set(q.ids);
      stillNote = stillTitle(stillTypes().filter(a => mine.has(a.id)));
    }
    const byId = new Map(data.groups.flatMap(g => g.actors).map(a => [a.id, a]));
    const left = (q.ids || []).map(i => byId.get(i) || {id: i, code: "", name: ""}).filter(a => a.status !== "converted" && a.status !== "still");
    return {id: q.id, lane: q.lane || "", complexity: q.complexity || 0, state, round, name, note: c && c.note ? c.note.replace(new RegExp("^" + c.session + ": "), "") : "", owner: c ? c.session : "", prog,
      stillNote, left, time: c ? c.time : 0};
  });
}
// open items grouped by lane in plan.json's order (top, bottom, main, then any other); each lane keeps its own order
const LANES = ["top", "bottom", "main"], laneName = l => l ? l[0].toUpperCase() + l.slice(1) : "Other";
function byLane(items) {
  const lanes = [...LANES, ...new Set(items.map(x => x.lane).filter(l => !LANES.includes(l)))];
  return lanes.map(l => [l, items.filter(x => x.lane === l || (!l && !x.lane))]).filter(([, xs]) => xs.length)
    .concat(items.some(x => !x.lane) && !lanes.includes("") ? [["", items.filter(x => !x.lane)]] : []);
}
const queueRound = items => Math.max(0, ...items.map(x => +x.round).filter(Boolean));
function renderQueue() {
  const items = queueItems(), round = queueRound(items);
  const by = s => items.filter(x => x.state === s);
  $("queueMeta").textContent = (round ? `round ${round} · ` : "") + `${by("done").length} done · ${by("working").length} working · ${by("open").length} open`;
  $("nOpen").textContent = by("open").length; $("nWorking").textContent = by("working").length; $("nDone").textContent = by("done").length;
  $("qOpen").innerHTML = byLane(by("open")).map(([l, xs]) => `<div class="laneHead"><span class="sq" style="background:${l ? color(l) : "#c3ced8"}"></span>${esc(laneName(l))} · ${xs.length}</div>` +
    xs.map(x => `<div class="q"><span class="name">${esc(x.id)}</span><span class="desc">${esc(x.name)}</span>${leftHtml(x)}</div>`).join("")).join("");
  $("qWorking").innerHTML = by("working").map(x => {
    const w = x.prog ? 100 * x.prog[0] / x.prog[1] : 0;
    return `<div class="q working"><div class="qHead"><span class="name">${esc(x.id)}</span>
      <span class="owner"><span class="sq" style="background:${color(x.owner)}"></span>${esc(x.owner)}</span></div>
      <div class="qbar"><div style="width:${w}%"></div></div>
      <span class="qcount"${x.stillNote ? ` title="${esc(x.stillNote)}"` : ""}>${x.prog ? `${x.prog[0]} / ${x.prog[1]}${x.prog[2]}` : "no count yet"}</span>
      <span class="desc">${esc(x.note || x.name)}</span>${leftHtml(x)}</div>`;
  }).join("");
  // the newest done first; past DONE_SHOWN the rest fold behind a "+ N more"
  const done = by("done").sort((a, b) => b.time - a.time), more = done.length - DONE_SHOWN;
  const earlier = (data.queue_done || []).length;
  $("qDone").innerHTML = (doneAll ? done : done.slice(0, DONE_SHOWN)).map(x => `<div class="q done" title="${esc(x.note || x.name)}"><span class="name">${esc(x.id)}</span>
    <span class="desc">${esc(x.note || x.name)}</span><span class="sq" style="background:${color(x.owner)}"></span></div>`).join("") +
    (more > 0 ? `<a class="earlier" id="doneMore">${doneAll ? "Show fewer" : `+ ${more} more`}</a>` : "") +
    (earlier ? `<div class="earlier" title="${esc(data.queue_done.join(", "))}">+ ${earlier} from earlier rounds</div>` : "");
}

$("qDone").addEventListener("click", e => { if (e.target.id === "doneMore") { doneAll = !doneAll; renderQueue(); } });

// --- known issues and the commit log ---
function issueList() {
  return (data.known_issues || []).map(i => {
    if (typeof i === "object") return i;
    const m = i.match(/^([^:]{3,60}): (.+)$/s);   // a plain "Title: detail" string, else the whole line as the title
    return m ? {title: m[1], detail: m[2]} : {title: i, detail: ""};
  });
}
function renderIssues() {
  const list = issueList();
  $("issueMeta").textContent = list.length;
  $("issues").innerHTML = list.map(k => `<div class="issue"><b>${esc(k.title)}</b>${k.detail ? `<span>${esc(k.detail)}</span>` : ""}</div>`).join("");
}
// a commit as the log shows it: who (the "session NAME" tag; WW-10's are web's, the rest main's), what it
// belongs to (its queue item tag, else the ticket) and its subject without those
function logEntries() {
  return (data.commits || []).slice(0, LOG_COUNT).map(m => {
    const t = (m.subject.match(/^(WW-\d+): /) || [])[1] || "";
    return {hash: m.hash, time: m.time,
      sess: (m.subject.match(/\bsession (\w+)/) || [])[1] || (t === "WW-10" ? "web" : "main"),
      scope: (m.subject.match(/\(([\w-]+)[;,] session \w+\)\s*$/) || [])[1] || t,
      msg: m.subject.replace(/^WW-\d+: /, "").replace(/\s*\((?:[\w-]+[;,] )?session \w+\)\s*$/, "").replace(/\s*\(([^()]*)[;,] session \w+\)\s*$/, " ($1)")};
  });
}
const entryHtml = e => `<div class="entry"><i style="background:${color(e.sess)}"></i>
      <span class="meta"><b>${esc(e.hash)}</b>${esc(e.sess)} · ${esc(e.scope)} · ${ago(e.time)}</span><span>${esc(e.msg)}</span></div>`;
function renderLog() { $("log").innerHTML = logEntries().map(entryHtml).join(""); }

// --- phones: the mobile layout (tabs Now, Shots, Queue, Log; the tab is kept in the URL's hash) ---
const TABS = ["now", "shots", "queue", "log"], SHOTS_STEP = 6;
let mTab = TABS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "now", mQ = "working", mL = "commits", mShown = SHOTS_STEP;
const isPhone = () => matchMedia("(max-width: 599px)").matches;
function setTab(t) {
  if (t === mTab) return;
  mTab = t; $("mScroll").scrollTop = 0;
  history.replaceState(null, "", "#" + t);
  renderMobile();
}
$("mTabs").addEventListener("click", e => { const b = e.target.closest("button"); if (b) setTab(b.dataset.tab); });
$("mMini").addEventListener("click", () => setTab("now"));
// a link or a typed hash (#shots, #queue...) picks the tab; #retest opens the bug list
addEventListener("hashchange", () => {
  const h = location.hash.slice(1);
  if (TABS.includes(h)) setTab(h); else if (h === "retest") location.replace("testing.html#retest");
});
function ringArc(id, frac, circ) { $(id).setAttribute("stroke-dasharray", `${frac * circ} ${Math.ceil(circ)}`); }
const segHtml = (list, cur) => list.map(([id, label, dot, n]) =>
  `<button data-id="${id}" class="${id === cur ? "on" : ""}">${dot ? `<i style="background:${dot}"></i>` : ""}${label}${n !== "" ? `<span>${n}</span>` : ""}</button>`).join("");
function renderMobile() {
  if (!data) return;
  const o = overall(), frac = o.n ? o.done / o.n : 0, p = (o.n ? pct(o.done, o.n) : 0) + "%";
  for (const b of $("mTabs").children) b.classList.toggle("on", b.dataset.tab === mTab);
  for (const [t, id] of [["now", "mNow"], ["shots", "mShots"], ["queue", "mQueue"], ["log", "mLogPane"]]) $(id).classList.toggle("on", t === mTab);
  $("mTitle").textContent = data.title || "WWHD Recomp";
  $("mMini").hidden = mTab === "now";
  ringArc("mMiniArc", frac, 113.1); $("mMiniPct").textContent = p;
  const open = openBugList();
  $("mBadge").hidden = !open.length; $("mBadge").textContent = open.length;

  if (mTab === "now") {
    ringArc("mRingArc", frac, 257.6); $("mRingPct").textContent = p;
    $("mStats").innerHTML = statsHtml(o);
    $("mPhases").innerHTML = phasesHtml(o); $("mPhases").hidden = !o.phases.length;
    $("mAgents").innerHTML = agentList().map(a => `<div class="mAgent"><i style="background:${color(a.name)}"></i><div>
      <div class="mAgentHead"><b>${esc(a.name)}</b><span class="${a.live ? "live" : ""}">${agoText(a.last)}</span></div>
      ${a.task ? `<span class="task">${esc(a.task)}</span>` : ""}<p>${esc(a.text)}</p></div></div>`).join("") ||
      `<span class="empty" style="padding:0 16px">No session has reported yet.</span>`;
    const fixed = bugList.filter(x => x.state === "fixed").length;
    $("mBugMeta").textContent = `${open.length} open bug${open.length === 1 ? "" : "s"}`;
    $("mBugs").innerHTML = open.map(x => {
      const v = bugView(x);
      return `<div class="mBug" data-id="${esc(x.id)}">
        <div class="bugHead"><span class="id">${esc(x.id)}</span><span class="pill">open</span><span class="ago">${agoText(x.time)}</span></div>
        <div class="title">${esc(x.title)}</div><div class="body">${esc(v.body)}</div>
        <div class="mBugFoot"><span class="needs">Needs ${esc(v.needs)}</span>${v.chev ? `<span class="chev">${esc(v.chev)}</span>` : ""}</div></div>`;
    }).join("") + `<a class="mRetest" href="testing.html#retest"><b>${fixed}</b><span>fixed, waiting for your retest</span><em>Open ›</em></a>`;
    const x = shotList[0];
    $("mLatestSec").hidden = !x;
    if (x) {
      const sc = splitCaption(x);
      $("mLatestAgo").textContent = agoText(x.time);
      $("mLatest").innerHTML = `<div class="mLatest"><img src="${esc(x.file)}" alt="${esc(sc.place)}" loading="lazy">
        <div><b>${esc(sc.place)}</b>${sc.cap ? `<p>${esc(sc.cap)}</p>` : ""}<em>All ${shotList.length} screenshots ›</em></div></div>`;
    }
  } else if (mTab === "shots") {
    const n = shotList.length, shown = Math.min(mShown, n);
    $("mShotMeta").textContent = n ? `${n} screenshots · newest first` : "none yet";
    $("mFeed").innerHTML = shotList.slice(0, shown).map((x, i) => {
      const sc = splitCaption(x);
      return `<div class="mShot"><img src="${esc(x.file)}" alt="${esc(sc.place)}" loading="lazy" data-i="${i}">
        <div><b>${esc(sc.place)}</b>${sc.cap ? `<p>${esc(sc.cap)}</p>` : ""}<span>${sc.tag ? esc(sc.tag) + " · " : ""}${agoText(x.time)}</span></div></div>`;
    }).join("");
    $("mMore").hidden = shown >= n;
    $("mShowing").textContent = n ? `Showing ${shown} of ${n}` : "";
  } else if (mTab === "queue") {
    const items = queueItems(), round = queueRound(items), by = st => items.filter(x => x.state === st);
    $("mRound").textContent = round ? `round ${round}` : "";
    $("mQSeg").innerHTML = segHtml([["working", "Working", "#e0943a", by("working").length], ["open", "Open", "#8494a4", by("open").length],
      ["done", "Done", "#3da343", by("done").length]], mQ);
    const card = x => {
      const w = x.prog ? Math.round(100 * x.prog[0] / x.prog[1]) : 0;
      return `<div class="mQ"><div class="mQHead"><b>${esc(x.id)}</b><span><i style="background:${x.owner || x.lane ? color(x.owner || x.lane) : "#c3ced8"}"></i>${esc(x.owner || (x.lane ? x.lane + "'s lane" : "unassigned"))}</span></div>
        ${x.state === "working" ? `<div class="mQBar"><div><div style="width:${w}%"></div></div><span>${x.prog ? `${w}%` : "no count"}</span></div>` : ""}
        <p>${esc(x.state === "open" ? x.name : x.note || x.name)}</p>${x.state !== "done" ? leftHtml(x) : ""}</div>`;
    };
    // open: each lane's list in its own order; working and done: the newest first
    $("mQList").innerHTML = (mQ === "open" ? byLane(by("open")).map(([l, xs]) => `<div class="mLane"><i style="background:${l ? color(l) : "#c3ced8"}"></i>${esc(laneName(l))} · ${xs.length}</div>` + xs.map(card).join("")).join("") :
      by(mQ).sort((a, b) => b.time - a.time).map(card).join("")) || `<div class="mEmpty">Nothing ${mQ === "open" ? "open" : mQ === "done" ? "done yet" : "being worked on"}.</div>`;
    if (mQ === "done" && (data.queue_done || []).length) $("mQList").innerHTML += `<div class="mShowing">+ ${data.queue_done.length} from earlier rounds</div>`;
  } else {
    const log = logEntries(), issues = issueList();
    $("mLSeg").innerHTML = segHtml([["commits", "Commits", "", log.length], ["issues", "Issues", "", issues.length], ["nums", "Numbers", "", ""]], mL);
    $("mLBody").innerHTML = mL === "commits" ? `<div class="mCap">commits to main</div><div class="mLog">${log.map(entryHtml).join("")}</div>` :
      mL === "issues" ? `<div class="mPanel">${issues.map(k => `<div class="issue"><b>${esc(k.title)}</b>${k.detail ? `<span>${esc(k.detail)}</span>` : ""}</div>`).join("")}</div>` :
      `<div class="mPanel">${numList().map(([l, v, t]) => `<div class="mNum"${t ? ` title="${esc(t)}"` : ""}>${l}<span>${v}</span></div>`).join("")}</div>`;
  }
}
$("mBugs").addEventListener("click", e => {
  const card = e.target.closest(".mBug"); if (!card) return;
  openBugs[card.dataset.id] = !openBugs[card.dataset.id]; renderMobile(); renderBugs();
});
$("mLatest").addEventListener("click", () => setTab("shots"));
$("mFeed").addEventListener("click", e => { if (e.target.tagName === "IMG") openViewer(shotList, +e.target.dataset.i); });
$("mMore").addEventListener("click", () => { mShown += SHOTS_STEP; renderMobile(); });
$("mQSeg").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { mQ = b.dataset.id; renderMobile(); } });
$("mLSeg").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { mL = b.dataset.id; renderMobile(); } });

// --- Claude usage: the account's meters (publish.sh usage, every 5 minutes from the editing machine) ---
const WRAP_AT = 95;   // the owner's rule (75% on 2026-10-06, 90%, then 95% on 2026-10-07): at it, sessions wrap up (finish, commit, hand off), not stop dead
function meterLabel(m) {
  if (m.id === "session") return "5-hour window";
  if (m.id === "weekly_all") return "This week, all models";
  const model = m.id.split(":")[1] || m.label;
  return "This week, " + model.charAt(0).toUpperCase() + model.slice(1);
}
function resetText(iso) {
  const t = Date.parse(iso); if (!t) return "";
  const s = Math.max(0, (t - Date.now()) / 1000), d = new Date(t);
  const clock = d.toLocaleTimeString([], {hour: "numeric", minute: "2-digit"});
  const left = s < 3600 ? Math.round(s / 60) + " min" : s < 86400 ? `${Math.floor(s / 3600)} h ${Math.round(s % 3600 / 60)} min`
    : `${Math.floor(s / 86400)} d ${Math.round(s % 86400 / 3600)} h`;
  return s < 86400 ? `resets in ${left} (${clock})` : `resets ${d.toLocaleDateString([], {weekday: "short"})} ${clock} (in ${left})`;
}
function usageHtml() {
  if (!usage || !usage.meters || !usage.meters.length) return "";
  const age = Date.now() / 1000 - (usage.published || usage.fetchedAt || 0), stale = usage.stale || age > 1200;
  return `<div class="eyebrow">Claude usage<span class="${stale ? "stale" : ""}">${stale ? "as of " + agoText(usage.fetchedAt) : "updated " + agoText(usage.fetchedAt)}</span></div>` +
    usage.meters.map(m => `<div class="meter"><div class="meterHead">${esc(meterLabel(m))}<b>${Math.round(m.percent)}%</b></div>
      <div class="meterBar ${esc(m.severity)}"><div style="width:${Math.min(100, m.percent)}%"></div>${m.id === "weekly_all" ? `<i style="left:${WRAP_AT}%"></i>` : ""}</div>
      ${m.resetsAt ? `<small>${esc(resetText(m.resetsAt))}</small>` : ""}</div>`).join("") +
    (usage.meters.some(m => m.id === "weekly_all") ? `<div class="usageNote"><i></i>${WRAP_AT}%: sessions wrap up their work for the week</div>` : "");
}
function renderUsage() {
  const h = usageHtml();
  for (const id of ["usage", "mUsage"]) { $(id).hidden = !h; $(id).innerHTML = h; }
}

function renderFresh(ok) {
  if (ok) lastOk = Date.now() / 1000;
  $("freshDot").className = ok ? "" : "stale";
  $("fresh").textContent = data ? `Data from ${agoText(data.generated)} · every 20 s` + (ok ? "" : " · can't reach the server") : "Loading…";
  $("mDot").className = ok ? "" : "stale";
  $("mFresh").textContent = data ? `${(data.ticket || "").split(":")[0] || "WW-4"} · data ${agoText(data.generated)}` + (ok ? "" : " · offline") : "Loading…";
}

async function refresh() {
  const [p, n, s, a, c, b, u] = await Promise.all([get("progress.json"), get("sessions.json"), get("shots.json"), get("shots-archive.json"),
    get("claims.json"), get("bugs.json"), get("usage.json")]);
  if (u) usage = u;
  if (c) claims = c;
  if (b) bugList = b;
  if (n) sessions = n;
  if (s) {
    // the newest in shots.json, older ones in shots-archive.json (a shot can be in both for a moment)
    const seen = new Set();
    const list = s.concat(a || []).filter(x => !seen.has(x.file) && seen.add(x.file)).sort((x, y) => y.time - x.time);
    shotList = list;
  }
  if (p) data = p;
  if (data) { renderSide(); renderQueue(); renderIssues(); renderLog(); }
  renderAgents(); renderShots(); renderBugs();
  renderMobile(); renderUsage();
  renderFresh(!!p);
}
// the old bug list's link (#retest) is the testing page now
if (location.hash === "#retest") location.replace("testing.html#retest");
refresh();
setInterval(refresh, 20000);
</script>
