# Reference Cemu game profile for WWHD US v0 (copied into portable/gameProfiles by run.sh).
# Single-core *interpreter*: all guest threads run on one host thread in a fixed order, and no
# background JIT thread decides (by host timing) when code switches from interpreted to compiled,
# which moved timeslice boundaries between runs. The virtual clock (REF_VIRTUAL_CLOCK=1) needs both.
[CPU]
cpuMode = 0
